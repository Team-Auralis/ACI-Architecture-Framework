[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generational-context"
version = "0.1.0"
description = "Tiered Attention Lifecycle & The Fool's Theorem Prevention Engine for Long-Horizon AI Agents"
readme = "docs/research/CONTEXT_ARCHITECTURE_TRIFECTA.md"
requires-python = ">=3.9"
authors = [
  { name = "Shaurya Sanyal", email = "shauryasanyal@gmail.com" }
]
keywords = ["llm", "agents", "context-engineering", "memory", "attention", "ai-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Team-Auralis/ACI-Architecture-Framework"
Repository = "https://github.com/Team-Auralis/ACI-Architecture-Framework"
