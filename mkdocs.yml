site_name: ACI Architecture Framework
site_description: The official specification and engineering framework for Artificial Civilization Intelligence (ACI) and Open-ended Civilizational Intelligence (OCI).
site_author: Team Auralis
repo_url: https://github.com/Team-Auralis/ACI-Architecture-Framework
repo_name: Team-Auralis/ACI-Architecture-Framework

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: README.md
  - Master Guide (ACI vs OCI): docs/ACI_VS_OCI_MASTER_GUIDE.md
  - The Paradigm Shift:
    - Beyond ASI: docs/BEYOND_ASI_THE_ACI_PARADIGM.md
    - ACI Definition: docs/ACI_DEFINITION.md
    - Origin & Provenance: docs/ACI_ORIGIN_AND_PROVENANCE.md
    - ACI vs AGI vs ASI: docs/ACI_VS_AGI_VS_ASI.md
  - System Architecture:
    - Target Architecture: docs/architecture/ACI_SYSTEM_ARCHITECTURE.md
  - Research & Evaluation:
    - ACI-001 Benchmark: docs/research/ACI_001_BENCHMARK.md
    - OCI Research Report: docs/ACI_AUDIT_REPORT.md
  - Deep Notes (Math & Theory):
    - Mathematical Foundations: notes/OCI_MATHEMATICAL_FOUNDATIONS.md
